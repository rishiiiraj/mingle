<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="description" content="Mingle: brand deals that fit your audience, with terms locked before you film.">
<title>Mingle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head><body>
<div class="app" id="app">
  <header class="top">
    <div class="brandmark"><span class="wordmark">Mingle</span><span class="ver">BETA</span></div>
    <div class="role" role="group" aria-label="Choose your side">
      <button data-act="role" data-v="creator" aria-pressed="true">Creator</button>
      <button data-act="role" data-v="brand" aria-pressed="false">Brand</button>
      <button data-act="role" data-v="team" aria-pressed="false">Team</button>
    </div>
  </header>
  <p class="banner" id="banner">Connecting to Mingle…</p>
  <main id="view" aria-live="polite"></main>
  <p class="foot">Mingle is an ISB student project. A person on our team reads every brief. These are agreed terms, not a legal contract.</p>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/app.js" defer></script>
</body></html>
